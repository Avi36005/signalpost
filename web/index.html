<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AviScope · Company research</title><meta name="description" content="Explore Norwegian companies, inspect source evidence, and track verified changes."><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="#explorer"><span class="mark">A</span><strong>AviScope</strong><span class="subtitle">Company research</span></a><span class="local-label"><i></i> Local workbench</span></header>
<div class="shell"><aside><nav aria-label="Main navigation"><a href="#explorer" data-view="explorer">◫ <span>Companies</span></a><a href="#changes" data-view="changes">↗ <span>Changes</span></a><a href="#runs" data-view="runs">≡ <span>Runs & evidence</span></a></nav><div class="sidebar-note">Norway · Signalpost entry<br><small>Facts with a traceable source.</small></div></aside>
<main id="main" tabindex="-1"><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main></div>
<dialog id="receipt" aria-labelledby="receipt-title"><div class="dialog-heading"><div><span class="eyebrow">Evidence receipt</span><h2 id="receipt-title">Source details</h2></div><button id="close-receipt" class="icon-button" aria-label="Close evidence receipt">×</button></div><div id="receipt-body"></div></dialog>
<template id="explorer-template"><div class="page-heading"><div><span class="eyebrow">Company explorer</span><h1>Know the company.<br><span class="muted">See the evidence.</span></h1><p>Research a Norwegian organisation number, or explore saved profiles.</p></div><div class="research-box"><label for="research-input">Research a company</label><form id="research-form"><input id="research-input" placeholder="9-digit organisation number" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" required><button type="submit">Research <span aria-hidden="true">↗</span></button></form><small>Official records first. Missing information stays visible.</small></div></div><section class="panel"><div class="table-toolbar"><div><h2>Researched companies <span id="company-count" class="count">0</span></h2><p class="small muted">Select a fact to inspect its source.</p></div><div class="filters"><label class="sr-only" for="search-input">Search saved companies</label><input id="search-input" type="search" placeholder="Search name or number"><label class="sr-only" for="filter-input">Filter available fields</label><select id="filter-input"><option value="">All profiles</option value="financials">With financials</option><option value="leadership">With leadership</option><option value="locations">With workplaces</option><option value="website">With verified website</option></select></div></div><div id="company-table" class="table-scroll"></div><div class="table-footer"><span id="page-status"></span><div><button id="previous-page" class="secondary">Previous</button><button id="next-page" class="secondary">Next</button></div></div></section><div class="compare-bar" id="compare-bar" hidden><span id="compare-count"></span><button id="compare-button">Compare companies</button><button id="clear-comparison" class="secondary">Clear</button></div><p class="footnote">Registry data: Brønnøysundregistrene · NLOD 2.0. Availability is evidence coverage, not an accuracy score.</p></template>
</body></html>
